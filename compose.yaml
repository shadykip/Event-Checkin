services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: event_checkin
      POSTGRES_USER: event_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "event_app", "-d", "event_checkin"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
